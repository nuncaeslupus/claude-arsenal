name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  # tag-release's recovery path starts this for a commit that has no CI run —
  # what an Actions outage at merge time leaves behind. Without a manual
  # trigger there is no way to produce the conclusion a tag now requires.
  workflow_dispatch:

permissions:
  contents: read

# PR CI runs when a PR is opened, reopened or marked ready for review — not on
# every push (owner decision: runner minutes). Later pushes are verified by
# dispatching this workflow on the branch before merge; see CLAUDE.md
# § CI triggers. Checks attach to the commit, so a dispatch run on the final
# head satisfies the required checks for it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No `paths-ignore` on the trigger, on purpose: these jobs are required checks,
# and a workflow skipped by a path filter never reports, which blocks the PR.
jobs:
  smoke:
    # Same name the matrix leg had, so the required check keeps reporting.
    name: smoke + lint (ubuntu-22.04)
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync

      - name: make smoke
        run: make smoke

      - name: make lint
        run: make lint

      - name: make audit-rule-drift
        run: make audit-rule-drift

      - name: make context-budget
        run: make context-budget

      - name: make sync-version-check
        run: make sync-version-check

      - name: make sync-sections-check
        run: make sync-sections-check

      # A security fix once landed in the canonical copy of a hook and never
      # reached the copy /init vendors, and nothing failed for months because
      # this check existed but ran nowhere.
      - name: make sync-dupes
        run: make sync-dupes

  # The macOS leg exists to catch BSD-userland / bash 3.2 breakage in the shell
  # scripts the bundle ships, and macOS runners queue far longer than Linux
  # ones, so it runs on main (and manual runs on main) only. On a PR the job is
  # skipped — a skipped job satisfies a required check, a missing one would
  # block the PR forever, which is why this is a job-level `if:` and not a
  # matrix entry or a path filter.
  smoke-macos:
    name: smoke + lint (macos-latest)
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync

      - name: make smoke
        run: make smoke

      - name: make lint
        run: make lint

      # The shell behaviour tests run the shipped bin/ scripts under BSD
      # userland and bash 3.2; Linux runs them in the `core tests` job. On
      # 3.11, the floor the shipped scripts check (`tomllib`) and INSTALL.md
      # states, so this leg is what keeps that floor tested.
      - name: Set up Python for the shell tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reader dependency and git identity
        run: |
          python3 -m pip install markdown
          git config --global user.email "ci@arsenal.example"
          git config --global user.name "Arsenal CI"

      - name: make test
        run: make test

  test:
    name: core tests
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The test suite invokes shipped scripts (e.g. task_select.py) via bare
      # `python3`, matching how consumers run them — so `python3` on PATH must
      # satisfy the project's own floor (pyproject.toml requires-python
      # >=3.12), not whatever ubuntu-22.04 defaults to (3.10).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The reader tests need `markdown`; without it they would skip, and a
      # skipped reader test reads as green. They fail instead when CI is set.
      - name: Install reader dependency
        run: python3 -m pip install markdown

      - name: Configure git identity (tests create temp repos)
        run: |
          git config --global user.email "ci@arsenal.example"
          git config --global user.name "Arsenal CI"

      - name: make test
        run: make test

  unit-tests:
    name: unit tests
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    # Separate from `core tests` on purpose: that job runs bare python3 to prove
    # the shipped scripts work the way a consumer runs them, so pytest — a dev
    # dependency — cannot run there. This job has the toolchain and runs it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: make test-units
        run: make test-units

  version-bump:
    name: version bump
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    # A dispatch run on a PR branch stands in for the push runs a PR no longer
    # gets, so it checks the bump too; against main there is nothing to compare.
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the base commit
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main
            echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a .bundle-version bump and CHANGELOG entry when shipped files change
        env:
          BASE: ${{ steps.base.outputs.sha }}
          VFILE: plugins/core/skills/init/assets/.bundle-version
          CHANGELOG: plugins/core/skills/init/assets/CHANGELOG.md
        run: |
          changed=$(git diff --name-only "${BASE}...HEAD")
          # "Shipped" = anything a consumer vendors: plugin skills + manifests.
          # Dev-only paths (tests, docs, CI, pyproject) may skip the bump.
          if ! printf '%s\n' "${changed}" | grep -qE '^(plugins/[^/]+/(skills|hooks|agents)/|plugins/[^/]+/\.claude-plugin/|\.claude-plugin/)'; then
            echo "No shipped files changed — bump not required."
            exit 0
          fi
          base_v=$(git show "${BASE}:${VFILE}" 2>/dev/null | tr -d '[:space:]' || true)
          head_v=$(tr -d '[:space:]' < "${VFILE}")
          if [ "${base_v}" = "${head_v}" ]; then
            echo "::error::Shipped files changed but ${VFILE} was not bumped (still ${head_v}). Bump it per CLAUDE.md."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "${base_v}" "${head_v}" | sort -V | tail -1)" != "${head_v}" ]; then
            echo "::error::${VFILE} went down (${base_v} -> ${head_v}); tag-release refuses a lower version."
            exit 1
          fi
          echo "version bump OK: ${base_v:-none} -> ${head_v}"
          # Escape the dots: unescaped, grep -E's `.` matches any character, so a
          # stray "## [2x6x0]" heading would satisfy a check meant to require
          # literally "2.6.0" — and the changelog display parsers (init.py /
          # check_update.sh) require a literal period-separated version, so that
          # consumer would get no entry for the release.
          head_v_re=$(printf '%s' "${head_v}" | sed 's/\./\\./g')
          if ! grep -qE "^## \[${head_v_re}\]" "${CHANGELOG}"; then
            echo "::error::${CHANGELOG} has no '## [${head_v}]' entry for the bumped version. Add one describing what changed for a downstream consumer — see CLAUDE.md § Versioning."
            exit 1
          fi
          echo "changelog OK: found an entry for ${head_v}"

  queue-doctor:
    name: queue doctor (dogfood)
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    # The handle check is only worth running if it can fail: without a token the
    # target has no channel, skips the check, and the job goes green on a board
    # whose task files have no issues at all.
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: make queue-doctor
        # On a pull request, a task this PR archives still has an open issue —
        # the protocol puts the archive and the close in one diff, so that state
        # is expected until it merges. On a push to main it is drift.
        run: make queue-doctor QUEUE_DOCTOR_FLAGS=${{ github.ref != 'refs/heads/main' && '--pending-merge' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

repos:
  - repo: local
    hooks:
      - id: skill-validate
        name: skill-validate (skill-workshop)
        description: Validate every skill root touched in the commit
        entry: bash plugins/skill-workshop/skills/skill-workshop/tests/precommit_validate.sh
        language: system
        pass_filenames: true
        files: ^plugins/[^/]+/skills/[^/]+/.*$
        require_serial: true

      - id: sync-duplicates-check
        name: sync-duplicates --check
        description: Fail if any duplicate-script group has drifted
        entry: uv run python plugins/skill-workshop/skills/skill-workshop/scripts/sync_duplicates.py --check
        language: system
        pass_filenames: false
        files: ^plugins/[^/]+/scripts/_shared/.*$
        require_serial: true

      - id: ruff-check
        name: ruff check (plugins)
        description: Lint Python under plugins/ — matches what CI's `make lint` runs
        entry: uv run ruff check plugins
        language: system
        pass_filenames: false
        files: ^plugins/.*\.py$
        require_serial: true

      - id: ruff-format
        name: ruff format --check (plugins)
        description: Verify formatting — matches what CI's `make lint` runs
        entry: uv run ruff format --check plugins
        language: system
        pass_filenames: false
        files: ^plugins/.*\.py$
        require_serial: true
